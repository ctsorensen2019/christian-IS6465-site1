<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>

        <form class="request-form" action="process-request.php" method="post">
            <label class="form-label" for="course">Course</label>
            <input class="form-control" id="course" name="course" required>

            <label class="form-label" for="date">Preferred date</label>
            <input class="form-control" id="date" name="date" type="date" required>

            <button class="btn" type="submit">Request Session</button>
        </form>
    </main>
</body>

</html>
